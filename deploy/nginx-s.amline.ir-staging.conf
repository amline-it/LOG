# Path-based routing for LOG on existing s.amline.ir staging site
# Include inside the s.amline.ir server block

location /inquiries/ {
    proxy_pass http://127.0.0.1:43123/inquiries/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/monitoring {
    proxy_pass http://127.0.0.1:43123/api/monitoring;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
