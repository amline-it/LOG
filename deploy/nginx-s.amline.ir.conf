server {
    listen 80;
    server_name s.amline.ir;

    # TODO: enable TLS when certbot/certificate is configured on the host
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/s.amline.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/s.amline.ir/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:43123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
