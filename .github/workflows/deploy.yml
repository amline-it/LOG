name: Build and Deploy LOG Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: amline-it/log-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amline-it/log-dashboard:latest
            ghcr.io/amline-it/log-dashboard:staging
            ghcr.io/amline-it/log-dashboard:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            export DEPLOY_DIR=/opt/amline-log
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone https://github.com/amline-it/LOG.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git checkout main
            git pull origin main
            if [ "${{ secrets.DEPLOY_HOST }}" = "212.80.24.56" ]; then
              bash deploy/deploy-test-amline.ir.sh
            else
              bash deploy/one-shot-staging.sh
              echo "Configure nginx from deploy/nginx-s.amline.ir-staging.conf if needed"
            fi
            curl -fsS http://127.0.0.1:43123/inquiries/analytics >/dev/null
